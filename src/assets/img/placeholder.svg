<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">

  <!-- background -->
  <rect width="400" height="300" fill="#faf8f4"/>

  <!-- plate -->
  <circle cx="200" cy="150" r="80" fill="#ffffff" stroke="#e6e6e6" stroke-width="6"/>
  <circle cx="200" cy="150" r="55" fill="#fff5e6"/>

  <!-- pasta -->
  <path d="M160 145 q20 -18 40 0 q20 18 40 0" stroke="#f4b942" stroke-width="6" fill="none"/>
  <path d="M160 160 q20 -18 40 0 q20 18 40 0" stroke="#f4b942" stroke-width="6" fill="none"/>
  <path d="M160 175 q20 -18 40 0 q20 18 40 0" stroke="#f4b942" stroke-width="6" fill="none"/>

  <!-- tomato sauce -->
  <circle cx="200" cy="150" r="8" fill="#e74c3c"/>
  <circle cx="180" cy="165" r="6" fill="#e74c3c"/>
  <circle cx="220" cy="165" r="6" fill="#e74c3c"/>

  <!-- basil -->
  <ellipse cx="210" cy="140" rx="6" ry="10" fill="#2ecc71"/>

  <!-- fork -->
  <line x1="300" y1="90" x2="300" y2="210" stroke="#9e9e9e" stroke-width="6"/>
  <line x1="290" y1="90" x2="290" y2="115" stroke="#9e9e9e" stroke-width="4"/>
  <line x1="300" y1="90" x2="300" y2="115" stroke="#9e9e9e" stroke-width="4"/>
  <line x1="310" y1="90" x2="310" y2="115" stroke="#9e9e9e" stroke-width="4"/>

  <!-- knife -->
  <line x1="100" y1="90" x2="100" y2="210" stroke="#9e9e9e" stroke-width="6"/>
  <path d="M100 90 Q115 115 100 140" fill="#9e9e9e"/>

</svg>